[project]
name = "symbolicator-server"
description = "A Python stand-in for ipswd's symbol server"
readme = "README.md"
requires-python = ">=3.14"
keywords = ["ipsw", "ipswd", "symbolication", "symbols", "dyld_shared_cache", "server"]
authors = [
    { name = "netanelc305", email = "netanelc305@protonmail.com" }
]
maintainers = [
    { name = "netanelc305", email = "netanelc305@protonmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dynamic = ["dependencies", "version"]

[project.urls]
"Homepage" = "https://github.com/netanelc305/symbolicator-server"
"Bug Reports" = "https://github.com/netanelc305/symbolicator-server/issues"

[project.scripts]
symbolicator = "symbolicator_server.__main__:main"

[tool.setuptools.packages.find]
exclude = ["docs*", "tests*"]

[tool.setuptools.package-data]
symbolicator_server = ["schema.sql"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
version = { attr = "symbolicator_server._version.__version__" }

[tool.setuptools_scm]
version_file = "symbolicator_server/_version.py"

[build-system]
requires = ["setuptools>=43.0.0", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"
